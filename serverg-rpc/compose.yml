services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # ❌ ปิด Security (ไม่ต้อง Login)
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # ⚠️ สำคัญ: จำกัด RAM ไว้ที่ 512MB 
    ports:
      - "9200:9200"

volumes:
  mongo-data:
    driver: local
